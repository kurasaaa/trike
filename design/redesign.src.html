<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PANAW Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/*@LEAFLET_CSS@*/</style>
<style>
:root{
  --navy:#0A3543; --teal:#0E7C86; --teal-50:#E8F4F5; --teal-700:#0B6870;
  --ink:#10232B; --muted:#5B6F76; --faint:#6B7F85; --line:#E3E9EA; --bg:#F4F7F7; --surface:#FFFFFF;
  --amber:#9A6412; --amber-50:#FFF4E2; --red:#C93C3C; --red-50:#FCEDED; --green:#1E8556; --green-50:#E7F5EE; --blue:#2F6FED;
  --r:12px; --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --navy:#2B6878; --teal:#14939E; --teal-50:#123A3F; --teal-700:#1AA6B2;
    --ink:#E4EDEF; --muted:#9DB0B5; --faint:#8399A0; --line:#2A3A40; --bg:#0F1A1E; --surface:#16242A;
    --amber:#E2A84B; --amber-50:#3A2C14; --red:#F06B6B; --red-50:#3D1E1E; --green:#4CC48A; --green-50:#163428; --blue:#5B8FF5; }
  body{background:#0B1316 !important;}
  .stage-bar h1{color:var(--ink) !important;}
  .stage-bar button{background:var(--surface) !important; border-color:var(--line) !important; color:var(--ink);}
  .phone{border-color:var(--line) !important;}
  .map{background:#1C2A2F !important;}
  .pimg,.hero{background:#1E2D33 !important; color:#52666C !important;}
  .opt.on .ic{background:var(--surface) !important;}
  .list-row .ic,.role-card .ic,.opt .ic,.result .ic{color:var(--ink) !important;}
  .trike-mk{background:var(--surface) !important; border-color:var(--ink) !important; color:var(--ink) !important;}
  .trike-mk.mine{background:var(--teal) !important; border-color:#fff !important; color:#fff !important;}
  .toast{background:#E4EDEF !important; color:#10232B !important;}
  .cta button{color:#0A3543 !important;}
  .seg button.on{box-shadow:none !important;}
  .stars button{color:#3A4C52;}
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{font-family:var(--font); color:var(--ink); background:#E7ECED; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; color:inherit;}
.i{width:20px; height:20px; flex:none;}
:focus-visible{outline:3px solid var(--teal); outline-offset:2px;}
.field:focus-visible{outline:none;}
.photo-list{display:flex; flex-direction:column; gap:12px; margin:0 16px 12px;}
.pcard.wide{width:100%;} .pcard.wide .pimg{aspect-ratio:16/9;}
.opt .s{line-height:1.35;}
.btn .i{width:18px; height:18px;}
input,select,textarea{font-family:inherit;}

/* ---------- demo stage (laptop): phones side by side ---------- */
.stage{min-height:100%; display:flex; flex-direction:column; align-items:center; padding:12px 16px 16px; gap:10px;}
.stage-bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 14px; max-width:880px; text-align:center;}
.stage-bar h1{font-size:15px; margin:0; font-weight:700; color:var(--navy);}
.stage-bar p{margin:0; font-size:12.5px; color:var(--muted);}
.stage-bar button{border:1px solid #C9D3D5; background:#fff; border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;}
.phones{display:flex; gap:28px; justify-content:center; flex-wrap:wrap;}
.phone-col{display:flex; flex-direction:column; align-items:center; gap:6px;}
.phone-label{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em; text-transform:uppercase;}
.phone{position:relative; width:390px; height:calc(100vh - 118px); max-height:820px; min-height:560px; background:var(--bg);
  border:1px solid #C9D3D5; border-radius:28px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 12px 32px rgba(16,35,43,.10);}
@media (max-width:860px){
  .stage{padding:0; gap:0;} .stage-bar,.phone-label{display:none;} .phones{gap:0; width:100%;}
  .phone-col{width:100%;} .phone-col.second{display:none;}
  .phone{width:100%; height:100vh; height:100dvh; max-height:none; min-height:0; border:none; border-radius:0; box-shadow:none;}
}

/* ---------- phone shell ---------- */
.content{position:relative; flex:1; min-height:0;}
.tab{position:absolute; inset:0; display:none; flex-direction:column;}
.tab.on{display:flex;}
.scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{width:0;}
.tabbar{flex:none; display:flex; background:var(--surface); border-top:1px solid var(--line); padding:6px 6px calc(8px + env(safe-area-inset-bottom));}
.tabbar button{flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:600; color:var(--faint); padding:6px 0; cursor:pointer; border-radius:8px;}
.tabbar button.on{color:var(--teal);}
.tabbar svg{width:22px; height:22px;}
.page{position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:30;}
.page-head{flex:none; display:flex; align-items:center; gap:8px; padding:12px 12px 10px; background:var(--surface); border-bottom:1px solid var(--line);}
.page-head h2{font-size:16px; margin:0; font-weight:700;}
.icon-btn{width:40px; height:40px; flex:none; border:none; background:var(--bg); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);}
.icon-btn svg{width:20px; height:20px;}
.pad{padding:16px;}
.head{padding:18px 16px 12px; background:var(--surface); border-bottom:1px solid var(--line);}
.head h1{font-size:22px; margin:0; font-weight:800; letter-spacing:-.01em;}
.head p{margin:4px 0 0; font-size:13px; color:var(--muted);}

/* ---------- basic parts ---------- */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:10px;
  padding:14px 16px; font-size:15px; font-weight:700; cursor:pointer; text-decoration:none;}
.btn.primary{background:var(--teal); color:#fff;} .btn.primary:hover{background:var(--teal-700);}
.btn.dark{background:var(--navy); color:#fff;}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:var(--surface); color:var(--red); border:1px solid #EFC9C9;}
.btn.sm{padding:10px 14px; min-height:40px; font-size:13px; width:auto;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.row-btns{display:flex; gap:10px;} .row-btns .btn{flex:1;}
.link{background:none; border:none; color:var(--teal); font-weight:600; font-size:13px; cursor:pointer; padding:0 6px; min-height:40px; min-width:40px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px;}
.stack{display:flex; flex-direction:column; gap:12px;}
.label{font-size:12px; font-weight:600; color:var(--muted); margin:0 0 6px; display:block;}
.section{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 8px;}
.field{width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:15px; background:var(--surface); color:var(--ink); outline:none;}
.field:focus{border-color:var(--teal);}
textarea.field{min-height:80px; resize:vertical;}
.hint{font-size:12px; color:var(--muted); line-height:1.45;}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; letter-spacing:.02em; white-space:nowrap;}
.tag.demo{background:var(--amber-50); color:var(--amber);} .tag.ok{background:var(--green-50); color:var(--green);}
.tag.info{background:var(--teal-50); color:var(--teal-700);} .tag.todo{background:var(--red-50); color:var(--red);}
.chips{display:flex; gap:6px; overflow-x:auto; padding:0 16px 2px;} .chips::-webkit-scrollbar{height:0;}
.filters{padding:12px 0 4px; display:grid; gap:10px;}
.muni-pick{display:flex; align-items:center; gap:10px; padding:0 16px; font-size:13px; font-weight:600; color:var(--muted);}
.muni-pick .field{flex:1; min-height:44px; padding:8px 12px; font-weight:600; color:var(--ink);}
.filter-line{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 16px 0; font-size:12.5px; color:var(--muted); font-weight:600;}
.chip .i{width:14px; height:14px; margin:-2px 4px 0 -2px; vertical-align:middle;}
.ride-title{font-size:20px; font-weight:800; margin:2px 0 0; line-height:1.25;}
.pickup-box{border:1px solid var(--line); border-radius:12px; padding:12px;}
.pickup-box .pickup-line{padding:0;} .pickup-box .pickup-line .grow{white-space:normal;}
.dest-box{display:flex; align-items:center; gap:10px; border:1px solid var(--teal); border-radius:12px; padding:8px 6px 8px 12px;}
.dest-box .ic{color:var(--teal); display:flex;} .dest-box .grow{flex:1; min-width:0;} .dest-box b{display:block; font-size:15px;}
.dest-box .grow span{display:block; font-size:12px; color:var(--muted);}
.pw{position:relative;} .pw .field{padding-right:72px;} .pw .link{position:absolute; right:4px; top:50%; transform:translateY(-50%);}
.form-error{background:var(--red-50); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600;}
.demo-access{margin-top:24px; border:1px dashed var(--line); border-radius:12px; padding:10px 12px; font-size:13px;}
.demo-access summary{cursor:pointer; font-weight:600; color:var(--muted); min-height:28px;}
.link.inline{display:inline; min-height:0; padding:0; font-size:inherit; text-decoration:underline;}
.chip{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 14px; min-height:38px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
.chip.on{background:var(--navy); border-color:var(--navy); color:#fff;}
.list-row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border:none; border-bottom:1px solid var(--line); width:100%; text-align:left; cursor:pointer; font-size:14px;}
.list-row:last-child{border-bottom:none;}
.list-row .ic{width:36px; height:36px; flex:none; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--navy);}
.list-row .ic svg{width:19px; height:19px;}
.list-row .t{font-weight:600;} .list-row .s{font-size:12px; color:var(--muted); margin-top:1px;}
.list-row .grow{flex:1; min-width:0;} .list-row .chev{color:var(--faint);}
.group{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;}
.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
.kv:last-child{border-bottom:none;} .kv .k{color:var(--muted);} .kv .v{font-weight:600; text-align:right;}
.kv.total{border-top:2px solid var(--ink); border-bottom:none; margin-top:4px; padding-top:11px;} .kv.total .v{font-size:17px;}
.toast{position:absolute; left:50%; top:58px; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:13px; font-weight:600;
  padding:10px 14px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:80; max-width:86%; text-align:center;}
.toast.on{opacity:1;}
.modal{position:absolute; inset:0; background:rgba(16,35,43,.45); display:flex; align-items:flex-end; z-index:70;}
.modal-box{background:var(--surface); width:100%; border-radius:16px 16px 0 0; padding:18px 16px 20px; max-height:85%; overflow:auto;}
.modal-box h3{margin:0 0 12px; font-size:17px;}
.seg{display:flex; background:var(--bg); border-radius:10px; padding:3px; gap:3px;}
.seg button{flex:1; border:none; background:none; border-radius:8px; padding:9px; min-height:40px; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:600; font-size:13px; cursor:pointer; color:var(--muted);}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08);}
.stepper{display:flex; align-items:center; gap:14px;}
.stepper button{width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:18px; font-weight:700; cursor:pointer;}
.stepper b{min-width:20px; text-align:center; font-size:17px;}
.avatar{width:44px; height:44px; flex:none; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;}
.empty{text-align:center; padding:40px 20px; color:var(--muted); font-size:14px;}
.empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px;}

/* ---------- auth ---------- */
.auth{position:absolute; inset:0; background:var(--surface); z-index:60; display:flex; flex-direction:column;}
.auth .scroll{padding:24px 20px;}
.brand{display:flex; align-items:center; gap:10px;}
.mark{width:40px; height:40px; border-radius:10px; background:var(--navy); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px; letter-spacing:.02em;}
.brand b{font-size:20px; letter-spacing:.02em;}
.hero-title{font-size:28px; font-weight:800; line-height:1.15; letter-spacing:-.02em; margin:40px 0 10px;}
.role-card{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; padding:16px; border:1.5px solid var(--line); border-radius:var(--r); background:var(--surface); cursor:pointer;}
.role-card.on{border-color:var(--teal); background:var(--teal-50);}
.role-card .ic{width:40px; height:40px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--navy); flex:none;}
.role-card b{display:block; font-size:15px;} .role-card span{font-size:13px; color:var(--muted);}

/* ---------- ride / drive: map + bottom sheet ---------- */
.map{position:absolute; inset:0; background:#DCE6E8; z-index:0;}
.map .netmap-svg{width:100%; height:100%;}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:78%; background:var(--surface); border-radius:16px 16px 0 0;
  box-shadow:0 -2px 14px rgba(16,35,43,.10); display:flex; flex-direction:column; z-index:10;}
.sheet.full{top:0; max-height:none; border-radius:0;}
.sheet .grab{width:36px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 0; flex:none;}
.sheet .scroll{padding:12px 16px 16px;}
.top-pill{position:absolute; top:12px; left:12px; right:12px; z-index:5; display:flex; justify-content:space-between; gap:8px; pointer-events:none;}
.top-pill > *{pointer-events:auto;}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--faint); display:inline-block;} .dot.on{background:var(--green);} .dot.demo{background:#D9952B;}
.where{display:flex; align-items:center; gap:10px; width:100%; padding:14px; border:none; border-radius:12px; background:var(--bg); font-size:16px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left;}
.where svg{width:20px; height:20px; color:var(--teal);}
.pickup-line{display:flex; align-items:center; gap:10px; padding:12px 2px 2px; font-size:13px;}
.pickup-line .pin{width:10px; height:10px; border-radius:50%; background:var(--blue); flex:none; box-shadow:0 0 0 3px #DCE7FC;}
.pickup-line .grow{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.quick{display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:0 16px;} .quick::-webkit-scrollbar{height:0;}
.quick button{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; text-align:left; cursor:pointer; max-width:170px;}
.quick b{display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .quick span{font-size:11.5px; color:var(--muted);}
.nearby{display:flex; align-items:center; gap:10px; margin-top:14px; padding:12px; border-radius:10px; background:var(--teal-50); font-size:13px; color:var(--teal-700); font-weight:600;}
.nearby svg{width:20px; height:20px; flex:none;}
.route-fields{position:relative; display:flex; flex-direction:column; gap:8px; padding-left:22px;}
.route-fields::before{content:""; position:absolute; left:6px; top:20px; bottom:20px; width:2px; background:var(--line);}
.rf{position:relative; display:flex; gap:8px; align-items:center;}
.rf::before{content:""; position:absolute; left:-20px; top:50%; width:10px; height:10px; margin-top:-5px; border-radius:50%; background:var(--blue);}
.rf.stop::before{background:var(--red); border-radius:2px;}
.rf .field{padding:11px 12px; font-size:14px;}
.rf .static{flex:1; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:var(--bg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.result{display:flex; gap:12px; align-items:center; padding:11px 0; border:none; border-bottom:1px solid var(--line); background:none; width:100%; text-align:left; cursor:pointer;}
.result .ic{width:34px; height:34px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; flex:none; color:var(--muted);}
.result .ic svg{width:17px; height:17px;}
.result .t{font-size:14px; font-weight:600;} .result .s{font-size:12px; color:var(--muted);}
.result .grow{flex:1; min-width:0;} .result .km{font-size:12px; color:var(--muted); white-space:nowrap;}
.summary{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--muted);}
.summary b{color:var(--ink); font-size:14px;}
.opt{display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:13px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); cursor:pointer;}
.opt.on{border-color:var(--teal); background:var(--teal-50);}
.opt .ic{width:42px; height:42px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; flex:none; color:var(--navy);}
.opt.on .ic{background:#fff;}
.opt .ic svg{width:22px; height:22px;}
.opt .grow{flex:1; min-width:0;} .opt b{font-size:15px;} .opt .s{font-size:12.5px; color:var(--muted); margin-top:2px;}
.opt .price{font-size:16px; font-weight:800; white-space:nowrap;}
.opt.off{opacity:.55; cursor:not-allowed;}
.fare-line{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 0 2px; font-size:13px; color:var(--muted);}
details.breakdown{margin-top:6px; font-size:13px;} details.breakdown summary{cursor:pointer; color:var(--teal); font-weight:600; padding:6px 0; list-style:none;}
details.breakdown summary::-webkit-details-marker{display:none;}
.progress{display:flex; gap:4px; margin:12px 0 4px;} .progress i{flex:1; height:4px; border-radius:2px; background:var(--line);} .progress i.on{background:var(--teal);}
.progress-l{display:flex; justify-content:space-between; font-size:10.5px; color:var(--faint); font-weight:600;}
.driver{display:flex; gap:12px; align-items:center;}
.driver .grow{flex:1; min-width:0;} .driver b{font-size:15px;} .driver .s{font-size:12.5px; color:var(--muted);}
.big-eta{font-size:26px; font-weight:800; letter-spacing:-.01em;}
.stars{display:flex; gap:6px; justify-content:center; margin:8px 0;}
.stars button{border:none; background:none; cursor:pointer; padding:7px; color:#C9D3D5;} .stars button.on{color:#D9952B;}
.stars svg{width:30px; height:30px;}
.ticket{border:1.5px dashed var(--teal); border-radius:12px; padding:16px; text-align:center; background:var(--teal-50);}
.ticket .code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:22px; font-weight:800; letter-spacing:.12em; margin:6px 0;}
.ticket .amt{font-size:32px; font-weight:800; margin:6px 0 2px;}
.req{border:1.5px solid var(--teal); border-radius:12px; padding:14px;}
.ring{width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
  background:conic-gradient(var(--teal) calc(var(--p) * 1%), var(--line) 0); position:relative;}
.ring::before{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--surface);}
.ring span{position:relative;}
.switch-big{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; border-radius:12px; background:var(--bg);}
.switch-big b{font-size:16px;}

/* ---------- explore ---------- */
.search{display:flex; align-items:center; gap:8px; margin-top:12px; padding:0 12px; border-radius:10px; background:var(--bg);}
.search svg{width:18px; height:18px; color:var(--faint); flex:none;}
.search input{flex:1; border:none; background:none; padding:12px 0; font-size:15px; outline:none;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 20px;}
.pcard{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface); cursor:pointer; text-align:left; padding:0;}
.pimg{aspect-ratio:4/3; background:#E2EAEC; display:flex; align-items:center; justify-content:center; color:#9DB0B5; position:relative; overflow:hidden;}
.pimg img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}

const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="${n === 'star' ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;

/* ---------- places ---------- */
const CAT_ICON = { Beaches: 'beach', Heritage: 'church', Nature: 'leaf', Landmarks: 'landmark', Ports: 'anchor', Towns: 'home', Essentials: 'store', Schools: 'landmark', 'Owner listings': 'store', Barangays: 'home' };
/* =====================================================================
   WHERE THE HUB RUNS
   LOCAL DEMO MODE: in this tab (the offline APK, or this file opened on a laptop).
   CONNECTED: on the PANAW server (window.PANAW_API in the online APK, or the
   server that served this page). Then accounts and rides are shared by every phone.
   ===================================================================== */
const API = typeof window.PANAW_API === 'string' ? window.PANAW_API.replace(/\/$/, '')
  : /^https?:$/.test(location.protocol) && !window.PANAW_LOCAL ? '' : null;
const REMOTE = API !== null;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* private mode: not kept */ } }
};
const LOCAL_KEY = 'panaw-local-v1';
let saveTimer = null;
function saveLocal() {
  if (REMOTE || saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; store.set(LOCAL_KEY, JSON.stringify({ hub: H.dump(), listings: Hub.listings })); }, 1500);
}
function loadLocal() {
  try { const s = JSON.parse(store.get(LOCAL_KEY)); if (s && H.restore(s.hub)) Hub.listings = s.listings || []; } catch { /* nothing saved */ }
}
const Remote = {
  token: null, phone: null, online: true, lrev: '',
  async call(path, body) {
    const r = await fetch(API + path, { method: body ? 'POST' : 'GET', cache: 'no-store',
      headers: { 'Content-Type': 'application/json', ...(this.token ? { Authorization: 'Bearer ' + this.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({ error: 'The PANAW server sent an unexpected reply.' }));
    if (r.status === 401 && this.token) { this.signOut(); }
    return j;
  },
  apply(v) {
    if (!v) return;
    // a poll leaves listings out when the board has not changed since lrev
    Object.assign(Hub, { accounts: v.accounts, drivers: v.drivers, requests: v.requests, listings: v.listings || Hub.listings, operators: v.operators, reports: v.reports });
    if (v.listings && v.listingsRev) this.lrev = v.listingsRev;
    const P = this.phone;
    if (P && v.me && this.token) P.account = v.me;
    Hub.emit();
  },
  signOut() { this.token = null; store.set('panaw-token', null); const P = this.phone; if (P && P.account) { P.account = null; P.render(); } },
  async poll() {
    if (!this.token) return;
    try { const j = await this.call('/api/hub/view?lrev=' + this.lrev); this.online = true; if (j.view) this.apply(j.view); }
    catch { if (this.online) { this.online = false; this.phone && this.phone.toast('Central sync offline. Retrying.'); } }
  }
};

const TR = {   // English: [Filipino, Hiligaynon]

  'Start trip': ['Simulan ang biyahe', 'Umpisahan ang biyahe'], 'Book a trike': ['Mag-book ng traysikel', 'Mag-book sang traysikel'],
  'Drive': ['Pagmamaneho', 'Pagmaneho'],
  'Where do you need a ride?': ['Saan ka magpapasundo?', 'Diin ka magpasundo?'], 'Pickup point': ['Sakayan', 'Sakayan'],
  'Where are you going?': ['Saan ka pupunta?', 'Diin ka makadto?'], 'Review fare': ['Tingnan ang pamasahe', 'Tan-awa ang pasahe'],
  'Get a tricycle to this place': ['Sumakay ng traysikel papunta rito', 'Magsakay sang traysikel pakadto diri'],

};
let LANG = LANGS[store.get('panaw-lang')] ? store.get('panaw-lang') : 'en';
function translate(root) {
  if (LANG === 'en' || !root) return;
  const i = LANG === 'fil' ? 0 : 1, w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) { const k = n.nodeValue.trim(), t = TR[k]; if (t) n.nodeValue = n.nodeValue.replace(k, t[i]); }
}
/* =====================================================================
   PHONE: one instance per screen; the passenger and driver phones share Hub.
   ===================================================================== */
function Phone(host, startAccountId) {
  const P = this;
  P.host = host;
  P.account = startAccountId ? byId(Hub.accounts, startAccountId) : null;
  P.guest = false;
  P.auth = { step: 'welcome', role: 'passenger', error: '' };
  P.tab = null; P.pages = [];
  P.ride = { pickup: defaultPickup(), stops: [], step: 'home', option: 'pickup', opts: { pax: 1, hire: 'regular', disc: 'none', dpax: 0 }, query: '', active: 0, reqId: null, rating: 0, refit: true };
  P.explore = { q: '', cat: 'All', muni: 'all' };
  P.drive = { refit: true };
  P.listing = { photos: [], pin: null };
  host.innerHTML = `<div class="content"></div><nav class="tabbar"></nav><div class="toast"></div>`;
  P.content = host.querySelector('.content'); P.tabbar = host.querySelector('.tabbar'); P.toastEl = host.querySelector('.toast');
  host.addEventListener('click', e => P.onClick(e));
  host.addEventListener('input', e => P.onInput(e));
  host.addEventListener('change', e => P.onChange(e));
  Hub.listeners.add(() => P.live());
  // labels drawn later are translated as they appear
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => translate(n.nodeType === 1 ? n : n.parentNode)))).observe(host, { childList: true, subtree: true });
  P.render();
}
function defaultPickup() {
  const n = byId(NET.nodes, 'd2');   // demo position: by the Buenavista New Terminal Market
  return { lat: n.lat + 0.0012, lng: n.lng - 0.0008, label: 'Sample point near Buenavista New Terminal Market', src: 'demo' };
}
const Pp = Phone.prototype;
Pp.q = function (s) { return this.host.querySelector(s); };
Pp.toast = function (m) { const t = this.toastEl; t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); };
Pp.isDriver = function () { return this.account && this.account.role === 'driver'; };
Pp.isOperator = function () { return this.account && this.account.role === 'operator'; };
Pp.tabs = function () {
  if (this.isOperator()) return [['vehicle', 'My vehicle', 'van'], ['explore', 'Explore', 'explore'], ['account', 'Account', 'user']];
  return this.isDriver() ? [['drive', 'Drive', 'wheel'], ['earnings', 'Earnings', 'wallet'], ['account', 'Account', 'user']]
    : [['ride', 'Ride', 'ride'], ['explore', 'Explore', 'explore'], ['account', 'Account', 'user']];
};

/* ---------- top-level render ---------- */
Pp.render = function () {
  const P = this;
  P.maps && Object.values(P.maps).forEach(m => m.map && m.map.remove());
  P.maps = {};
  if (!P.account && !P.guest) { P.tabbar.style.display = 'none'; return P.renderAuth(); }
  P.tabbar.style.display = '';
  const tabs = P.tabs();
  if (!P.tab || !tabs.some(t => t[0] === P.tab)) P.tab = tabs[0][0];
  P.content.innerHTML = tabs.map(([id]) => `<section class="tab" data-tab="${id}"></section>`).join('') + '<div class="pagehost"></div><div class="modalhost"></div>';
  P.tabbar.innerHTML = tabs.map(([id, label, icon]) => `<button data-go-tab="${id}">${ic(icon)}<span>${label}</span></button>`).join('');
  P.showTab(P.tab);
};
Pp.showTab = function (id) {
  const P = this; P.tab = id; P.pages = []; P.renderPage();
  P.content.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.dataset.tab === id));
  P.tabbar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.goTab === id));
  const el = P.content.querySelector(`.tab[data-tab="${id}"]`);
  ({ ride: () => P.renderRide(el), explore: () => P.renderExplore(el), account: () => P.renderAccount(el),

/* ---------- maps (Leaflet + CARTO light tiles; offline: stored-network drawing) ---------- */
Pp.map = function (key, el, onTap) {
  const P = this;
  if (P.maps[key] && P.maps[key].el === el) return P.maps[key];
  if (P.maps[key] && P.maps[key].map) P.maps[key].map.remove();   // its element was replaced
  if (typeof L === 'undefined') {
    el.innerHTML = TrikeMap.render(NET, { labels: 'terminals', height: 800 });
    return (P.maps[key] = { el, map: null, offline: true });
  }
  const map = L.map(el, { zoomControl: false, attributionControl: true, zoomAnimation: false, fadeAnimation: false, markerZoomAnimation: false }).setView([10.66, 122.63], 12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19,
    attribution: 'Tiles &copy; Esri &middot; Esri, HERE, Garmin, USGS, OpenStreetMap contributors' }).addTo(map);
  drawBasemap(map);
  const m = P.maps[key] = { el, map, layer: L.layerGroup().addTo(map), onTap };
  map.on('click', e => m.onTap && m.onTap({ lat: e.latlng.lat, lng: e.latlng.lng }));
  setTimeout(() => map.invalidateSize(), 0);
  return m;
};
/* Offline map: Guimaras coastline and roads from OpenStreetMap, stored in the app (data/basemap.json).
   It sits below the online tiles, so it shows wherever tiles cannot load. */
function drawBasemap(map) {
  const B = RAW.basemap; if (!B) return;
  map.createPane('base'); map.getPane('base').style.zIndex = 150;
  const r = L.canvas({ pane: 'base' }), dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const style = { coast: [dark ? '#5E8C96' : '#7FA7B0', 1.6], major: [dark ? '#C9B27A' : '#D9A441', 3], minor: [dark ? '#6C7F84' : '#A9B4B6', 1.8], local: [dark ? '#3E4F54' : '#CBD3D4', 1] };
  for (const k of ['local', 'minor', 'major', 'coast']) L.polyline(B[k], { renderer: r, color: style[k][0], weight: style[k][1], interactive: false }).addTo(map);
  map.attributionControl.addAttribution('Offline map &copy; OpenStreetMap contributors');
}
const trikeIcon = cls => L.divIcon({ className: '', html: `<div class="trike-mk ${cls}">${ic('trike')}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
const dotIcon = (color, size = 14) => L.divIcon({ className: '', html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)"></div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
const sqIcon = color => L.divIcon({ className: '', html: `<div style="width:14px;height:14px;border-radius:3px;background:${color};border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] });
function drawLayer(m, o) {
  if (!m || !m.map) return;
  m.layer.clearLayers();
  const pts = [];
  if (o.line && o.line.length > 1) { L.polyline(o.line.map(p => [p.lat, p.lng]), { color: '#0E7C86', weight: 5, opacity: .9 }).addTo(m.layer); pts.push(...o.line.map(p => [p.lat, p.lng])); }
  if (o.approach && o.approach.length > 1) L.polyline(o.approach.map(p => [p.lat, p.lng]), { color: '#0A3543', weight: 3, opacity: .55, dashArray: '6 6' }).addTo(m.layer);
  for (const t of o.trikes || []) L.marker([t.pos.lat, t.pos.lng], { icon: trikeIcon(t.cls), interactive: false }).addTo(m.layer);
  for (const s of o.stops || []) { L.marker([s.lat, s.lng], { icon: sqIcon('#C93C3C') }).bindTooltip(esc(s.name)).addTo(m.layer); pts.push([s.lat, s.lng]); }
  for (const s of o.places || []) { const mk = L.marker([s.lat, s.lng], { icon: dotIcon(s.listing ? '#9A6412' : '#0A3543', 12) }).bindTooltip(esc(s.name)).addTo(m.layer); if (s.onClick) mk.on('click', s.onClick); pts.push([s.lat, s.lng]); }
  if (o.pickup) { L.marker([o.pickup.lat, o.pickup.lng], { icon: dotIcon('#2F6FED', 16) }).addTo(m.layer); pts.push([o.pickup.lat, o.pickup.lng]); }
  if (o.fit) {
    const f = o.fitTo || pts;
    if (f.length > 1) m.map.fitBounds(f, { paddingTopLeft: [30, 60], paddingBottomRight: [30, o.bottomPad || 40], maxZoom: 15 });
    else if (f.length === 1) m.map.setView(f[0], 14);
  }
}

Pp.drawRideMap = function () {
  const P = this, R = P.ride, m = P.maps.ride; if (!m) return;
  const req = P.myRide(), active = req && ['requested', 'accepted', 'arrived', 'ontrip'].includes(req.status);
  const trikes = Object.values(Hub.drivers).filter(d => (d.online || (req && active && req.driverId === d.id)) && d.pos && d.status !== 'offline')
    .map(d => ({ pos: d.pos, cls: (req && req.driverId === d.id && active ? 'mine' : '') + (d.bot ? ' bot' : '') }));
  let line = null, stops = [];
  if ((R.step === 'options' || active) && R.stops.every(Boolean)) {
    const q = active ? req.quote : (R.option === 'terminal' ? P.quotes().qt : P.quotes().qp);
    if (q && !q.error) line = q.steps;
    stops = (active ? req.stopIds : R.stops).map(id => byId(PLACES, id));
  }
  const fit = R.refit; R.refit = false;
  drawLayer(m, { trikes, pickup: R.pickup, stops, line, fit, bottomPad: 360 });
};
Pp.updateRide = function () {
  const P = this, req = P.myRide();
  if (req && ['requested', 'accepted', 'arrived', 'ontrip', 'completed', 'nodriver'].includes(req.status) && P.ride.step !== 'done') {
    const key = req.status + Math.ceil((Hub.drivers[req.driverId] || {}).remainingMin || 0) + (req.reachedDest ? 'x' : '') + req.driverId
      + '|' + req.safety.length + (req.watch.prompt ? 'P' + req.watch.prompt.at : '');
    P.drawSafetyPrompt(req);   // countdown moves in place every tick
    if (req.watch.prompt && !P._prompted) { P._prompted = true; } else if (!req.watch.prompt) P._prompted = false;
    const alert = req.safety[req.safety.length - 1];
    if (alert && alert.type === 'alert_sent' && P._alerted !== alert.at) { P._alerted = alert.at; P.toast('Safety alert ready. Tap "Send this alert by text".'); }
    if (key !== P._rideKey) { P._rideKey = key; if (req.status === 'accepted' && P._last !== 'accepted') P.toast('Your trike is on the way'); P._last = req.status; P.drawRideSheet(); return; }
  } else if (P.ride.step === 'home') {
    const near = availableTrikes(P.ride.pickup).length;
    if (near !== P._near) { P._near = near; const el = P.q('.tab[data-tab="ride"] .nearby'); if (el) el.outerHTML = P.ride_home().match(/<div class="nearby">[\s\S]*$/)[0]; }
  } else if (P.ride.step === 'options') {
    // keep "Trike comes to you" honest: redraw when trikes appear or all go busy; otherwise update the minutes in place
    const t = availableTrikes(P.ride.pickup), any = t.length > 0;
    if (any !== P._optAny && !P.content.querySelector('.modalhost .modal')) {
      const d = P.q('details.breakdown'), open = d && d.open;
      P.drawRideSheet();
      const d2 = P.q('details.breakdown'); if (open && d2) d2.open = true;
      return;
    }
    const s = P.q('.tab[data-tab="ride"] [data-option="pickup"] .s'); if (s && any) s.textContent = `Nearest trike ${fmtMin(t[0].a.min)} away`;
  }
  P.drawRideMap();
};

/* Connected mode: while online, the driver's phone reports its GPS so passengers see the real trike.

Pp.startGps = function () {
  const P = this;
  if (!REMOTE || P._gpsWatch != null || !navigator.geolocation) return;
  let last = 0;
  P._gpsWatch = navigator.geolocation.watchPosition(p => {
    if (Date.now() - last < 5000) return; last = Date.now();
    P.act('gps', { lat: p.coords.latitude, lng: p.coords.longitude });
  }, () => P.toast('GPS unavailable. Passengers see your simulated position.'), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
};
Pp.stopGps = function () { if (this._gpsWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(this._gpsWatch); this._gpsWatch = null; };
Pp.renderDrive = function (el) {

Pp.myJob = function () { const id = this.account.unit; return Hub.requests.find(r => r.driverId === id && ['requested', 'accepted', 'arrived', 'ontrip'].includes(r.status)); };

Pp.drawDriveMap = function () {
  const P = this, m = P.maps.drive, d = P.me(), job = P.myJob(); if (!m) return;
  const trikes = [{ pos: d.pos, cls: 'mine' }];
  let line = null, approachLine = null, stops = [];

    stops = job.stopIds.map(id => byId(PLACES, id));
    line = job.quote.steps;
    if (job.status === 'requested' || job.status === 'accepted') { const a = approach(d.pos, job.pickup); approachLine = a && a.path; }
  }
  const fit = P.drive.refit || (job && job.status !== P._jobFit); P._jobFit = job && job.status; P.drive.refit = false;
  drawLayer(m, { trikes, pickup: job ? job.pickup : null, stops, line, approach: approachLine, fit, fitTo: job ? null : [[d.pos.lat, d.pos.lng]], bottomPad: 340 });
};
Pp.updateDrive = function () {
  const P = this, job = P.myJob(), d = P.me();
  const key = (job ? job.id + job.status + job.safety.filter(x => x.type === 'deviation').length + Math.ceil(d.remainingMin || 0) + (job.reachedDest ? 'x' : '') : 'none') + d.online + P.account.verified;
  if (key !== P._driveKey) { if (job && job.status === 'requested' && !(P._driveKey || '').startsWith(job.id)) P.toast('New ride request'); P._driveKey = key; P.drawDriveSheet(); }
  else {
    // the 60 s countdown moves in place, so Accept / Decline are never swapped under the driver's finger
    const ring = job && job.status === 'requested' && P.q('.tab[data-tab="drive"] .req .ring');
    if (ring) { const left = Math.max(0, 60 - (Date.now() - job.askedAt) / 1000); ring.style.setProperty('--p', left / 60 * 100); ring.querySelector('span').textContent = Math.ceil(left); }

};

function shrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); const k = Math.min(1, 1024 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .72)); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('Not an image')); };
    img.src = url;
  });
}

    <span class="grow"><div class="t">${esc(t.operator || 'Association to verify')}</div><div class="s">${esc(t.name)} · ${esc(muniName(t.municipality))}</div></span>

    <p class="hint" style="margin-top:10px">Names, officers and members come from the LGU and association inventory.</p></div>`];

/* =====================================================================
   EVENTS
   ===================================================================== */
Pp.onClick = function (e) {
  const P = this, t = e.target, c = s => t.closest(s);
  let el;
  // auth
  if ((el = c('[data-auth]'))) { P.auth.step = el.dataset.auth; P.auth.error = ''; P.auth.vals = null; return P.renderAuth(); }
  if ((el = c('[data-role]'))) { P.auth.role = el.dataset.role; return P.renderAuth(); }
  if ((el = c('[data-pw-toggle]'))) { const i = P.q('#' + el.getAttribute('aria-controls')), show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.textContent = show ? 'Hide' : 'Show'; el.setAttribute('aria-pressed', show); return; }
  if (c('[data-signup]')) return P.signup();
  if (c('[data-login]')) return P.login();
  if (c('[data-guest]')) { P.guest = true; P.tab = 'explore'; return P.render(); }
  if ((el = c('[data-to-auth]'))) { P.guest = false; P.auth.step = el.dataset.toAuth; return P.render(); }
  if (c('[data-logout]')) return P.logout();
  // navigation
  if ((el = c('[data-go-tab]'))) return P.showTab(el.dataset.goTab);
  if (c('[data-back]')) { P.pages.pop(); return P.renderPage(); }
  if ((el = c('[data-page]'))) return P.openPage(el.dataset.page);
  if ((el = c('[data-place]'))) { P._ph = 0; return P.openPage('place', el.dataset.place); }
  // explore
  if ((el = c('[data-cat]'))) { P.explore.cat = el.dataset.cat; return P.redrawFilters(); }
  if (c('[data-clear-filters]')) { Object.assign(P.explore, { cat: 'All', muni: 'all', q: '' }); const i = P.q('[data-explore-q]'); if (i) i.value = ''; return P.redrawFilters(); }
  if ((el = c('[data-ride-here]'))) { if (P.myRide()) { P.toast('Finish or cancel your current ride first'); return P.showTab('ride'); }
    Object.assign(P.ride, { stops: [el.dataset.rideHere], step: 'home', refit: true, ticket: null }); P.pages = []; P.showTab('ride'); return P.toast(pickupReady(P.ride.pickup) ? 'Destination set. Check your pickup point.' : 'Destination set. Now choose your pickup point.'); }
  if (c('[data-publish]')) return P.publish();
  if ((el = c('[data-rmph]'))) { P.listing.photos.splice(+el.dataset.rmph, 1); return P.drawThumbs(); }
  // ride
  const R = P.ride;
  if ((el = c('[data-ride]'))) { const s = el.dataset.ride; R.pickMode = false; if (s === 'search') { R.active = Math.max(0, R.stops.findIndex(x => !x)); if (R.active < 0) R.active = 0; R.query = ''; } R.step = s; R.refit = true; return P.drawRideSheet(); }
  if (c('[data-gps]')) return P.useGps();
  if ((el = c('[data-dest]'))) { Object.assign(R, { stops: [el.dataset.dest], step: 'home', refit: true }); return P.drawRideSheet(); }
  if (c('[data-confirm-pickup]')) { R.pickup = { ...R.pickup, src: 'confirmed' }; return P.drawRideSheet(); }
  if (c('[data-pick-pickup]')) { Object.assign(R, { pickMode: true, step: 'search', query: '' }); return P.drawRideSheet(); }
  if (c('[data-clear-dest]')) { R.stops = []; R.refit = true; return P.drawRideSheet(); }
  if (c('[data-review]')) { if (R.stops.length && R.stops.every(Boolean) && pickupReady(R.pickup)) { R.step = 'options'; R.refit = true; } return P.drawRideSheet(); }
  if ((el = c('[data-pick]'))) {
    if (R.pickMode) { const pl = byId(PLACES, el.dataset.pick); Object.assign(R, { pickMode: false, query: '', step: 'home', refit: true, pickup: { lat: pl.lat, lng: pl.lng, label: short(pl.name), src: 'place' } }); return P.drawRideSheet(); }
    R.stops[R.active] = el.dataset.pick; R.query = '';
    const next = R.stops.findIndex(x => !x);
    if (next >= 0) R.active = next; else { R.step = 'home'; R.refit = true; }
    return P.drawRideSheet();
  }
  if ((el = c('[data-edit-stop]'))) { R.active = +el.dataset.editStop; R.query = ''; return P.drawRideSheet(); }
  if ((el = c('[data-rm-stop]'))) { R.stops.splice(+el.dataset.rmStop, 1); R.active = Math.min(R.active, R.stops.length - 1); return P.drawRideSheet(); }
  if (c('[data-add-stop]')) { R.stops.push(''); R.active = R.stops.length - 1; R.query = ''; return P.drawRideSheet(); }
  if ((el = c('[data-option]'))) { if (el.disabled) return; R.option = el.dataset.option; return P.drawRideSheet(); }
  if (c('[data-fare-opts]')) return P.fareModal();
  if ((el = c('[data-mod]'))) return P.fareModalAct(el);
  if (c('[data-book]')) return P.book();
  const rideAct = (name, extra) => { const r = P.myRide(); return r ? P.act(name, { id: r.id, ...extra }).then(res => { if (res.error) P.toast(res.error); P.drawRideSheet(); return res; }) : Promise.resolve({}); };
  if (c('[data-cancel-ride]')) { const r = P.myRide(); if (r) P.act('cancel', { id: r.id }); R.reqId = null; R.step = 'options'; P.toast('Ride cancelled'); return P.drawRideSheet(); }
  if (c('[data-retry]')) return rideAct('retry');
  if ((el = c('[data-rate]'))) { R.rating = +el.dataset.rate; P.drawRideSheet(); return rideAct('rate', { stars: R.rating }); }
  if (c('[data-ride-new]')) { Object.assign(R, { reqId: null, stops: [], step: 'home', option: 'pickup', ticket: null, rating: 0, refit: true }); return P.drawRideSheet(); }
  if (c('[data-share]')) return P.shareModal();
  if (c('[data-copy-share]')) { (navigator.clipboard ? navigator.clipboard.writeText(P._shareText) : Promise.reject()).then(() => P.toast('Copied'), () => P.toast('Copy is not available here')); return; }
  if (c('[data-close-modal]')) { P.content.querySelector('.modalhost').innerHTML = ''; return; }
  if ((el = c('[data-report]'))) return P.reportModal(el.dataset.report);
  if ((el = c('[data-send-report]'))) {
    const v = P.formVals(), id = el.dataset.sendReport;
    P.content.querySelector('.modalhost').innerHTML = '';
    return P.act('report', { rideId: id, type: v.rtype, details: v.rdetails }).then(res => P.toast(res.error || `Report ${res.ref} received`));
  }
  if (c('[data-sos]')) {
    const req = P.myRide(); if (!req) return;
    if (!(P.account.contacts || []).length) { P.toast('Add an emergency contact first'); return P.openPage('contacts'); }
    if (!confirm('Alert your emergency contacts now with this trip and the trike\'s location?')) return;
    return rideAct('sos');
  }
  if (c('[data-safe]')) { P.toast('Thanks. The safety watch stays on.'); return rideAct('safe'); }
  if (c('[data-alert-now]')) return rideAct('sos');
  if ((el = c('[data-detour]'))) { P.toast('DEMO: trike pushed ' + el.dataset.detour + ' km off route'); const r = P.myRide(); if (r) P.act('detour', { id: r.id, km: +el.dataset.detour }); return; }
  if ((el = c('[data-receipt]'))) return P.openPage('receipt', el.dataset.receipt);
  if (c('[data-board]')) {
    const v = P.formVals(), typed = v.bunit === '__other' || !v.bunit, unit = (typed ? v.bother : v.bunit).toUpperCase();
    return P.act('board', { code: R.ticket.code, unit, typed }).then(res => {
      if (res.error) return P.toast(res.error);
      if (!(P.account.contacts || []).length) P.toast('Tip: add an emergency contact in Account > Safety');
      Object.assign(R, { reqId: res.id, ticket: null, step: 'active', refit: true }); P._rideKey = null;
      P.drawRideSheet();
    });
  }
  if (c('[data-pstart]')) return rideAct('pstart');
  if (c('[data-pend]')) return rideAct('pend');
  if ((el = c('[data-rm-contact]'))) return P.act('rmContact', { id: el.dataset.rmContact }).then(() => P.renderPage());
  if (c('[data-add-contact]')) {
    const v = P.formVals();
    return P.act('addContact', { name: v.cname, relation: v.crel, mobile: v.cmobile }).then(res => { P.toast(res.error || 'Contact added'); if (!res.error) P.renderPage(); });
  }
  // drive
  if ((el = c('[data-contact]'))) return P.contactOp(Hub.operators.find(o => o.id === el.dataset.op), el.dataset.contact);
  if ((el = c('[data-hire-group]'))) { P.hireDest = el.dataset.hireGroup; return P.openPage('hire', 'van'); }
  if ((el = c('[data-hire]'))) { P.hireDest = null; return P.openPage('hire', el.dataset.hire); }
  if ((el = c('[data-brgy-town]'))) return P.openPage('brgy', el.dataset.brgyTown);
  if ((el = c('[data-lang]'))) { LANG = el.dataset.lang; store.set('panaw-lang', LANG); phones.forEach(x => x.render()); return P.openPage('lang'); }
  if ((el = c('[data-hire-type]'))) { P.pages[P.pages.length - 1].data = el.dataset.hireType; return P.renderPage(); }
  if (c('[data-hire-clear]')) { P.hireDest = null; return P.renderPage(); }
  const vehicleTab = () => P.renderVehicle(P.q('.tab[data-tab="vehicle"]'));
  if ((el = c('[data-op-toggle]'))) return P.act('opToggle', { id: el.dataset.opToggle }).then(vehicleTab);
  if ((el = c('[data-op-save]'))) {
    const v = P.formVals();
    return P.act('opSave', { id: el.dataset.opSave, rate: v.erate, seats: v.eseats, notes: v.enotes }).then(res => { P.toast(res.error || 'Listing saved'); if (!res.error) vehicleTab(); });
  }
  if (c('[data-verify]')) return P.act('verify').then(() => { P.toast('Unit confirmed by TODA (demo)'); P.drawDriveSheet(); });
  if ((el = c('[data-online]'))) {
    const on = el.dataset.online === '1';
    return P.act('online', { on }).then(res => {
      if (res.error) return P.toast(res.error);
      P.toast(on ? 'You are online' : 'You are offline'); on ? P.startGps() : P.stopGps();
      P.drive.refit = true; P.drawDriveSheet();
    });
  }
  if ((el = c('[data-job]'))) {
    const j = P.myJob(), move = el.dataset.job; if (!j) return;
    return P.act('job', { id: j.id, move }).then(res => {
      if (res.error) P.toast(res.error); else if (move === 'complete') P.toast('Trip completed · ' + peso(res.fare));
      P.drawDriveSheet();
    });
  }
};
Pp.onInput = function (e) {
  const P = this;
  if (e.target.matches('[data-q]')) { P.ride.query = e.target.value; const r = P.q('[data-results]'); if (r) r.innerHTML = P.results(); }
  if (e.target.matches('[data-explore-q]')) { P.explore.q = e.target.value; P.drawGrid(); }
};
Pp.onChange = async function (e) {
  const P = this;
  if (e.target.matches('[data-muni-select]')) { P.explore.muni = e.target.value; return P.drawGrid(); }
  if (e.target.matches('[data-photos]')) {
    for (const f of [...e.target.files]) { if (P.listing.photos.length >= 3) break; try { P.listing.photos.push(await shrink(f)); } catch { P.toast('That file is not an image'); } }
    e.target.value = ''; P.drawThumbs();
  }
  if (e.target.matches('[name="bunit"]')) { const o = P.q('[data-other]'); if (o) o.style.display = e.target.value === '__other' ? '' : 'none'; }
  if (e.target.matches('[data-mod-disc]')) { P.ride.opts.disc = e.target.value; if (P.ride.opts.disc === 'none') P.ride.opts.dpax = 0; else P.ride.opts.dpax = Math.max(1, P.ride.opts.dpax); P.fareModal(); }
};
Pp.useGps = function () {
  const P = this;
  if (!navigator.geolocation) return P.toast('This device has no location service');
  navigator.geolocation.getCurrentPosition(p => {
    const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (nearestNode(pos).km > 25) return P.toast('You are outside Guimaras. Tap the map to set a pickup instead.');
    P.ride.pickup = { ...pos, label: 'Your current location', src: 'gps' }; P.ride.refit = true; P.drawRideSheet();
  }, () => P.toast('Location unavailable. Tap the map to set your pickup.'), { timeout: 10000 });
};
Pp.fareModal = function () {
  const P = this, o = P.ride.opts, host = P.content.querySelector('.modalhost');
  host.innerHTML = `<div class="modal"><div class="modal-box"><h3>Fare options</h3><div class="stack">
    <div><span class="label">Passengers</span><div class="stepper"><button data-mod="pax-">−</button><b>${o.pax}</b><button data-mod="pax+">+</button></div></div>
    <div><span class="label">Hire type</span><div class="seg"><button class="${o.hire === 'regular' ? 'on' : ''}" data-mod="regular">Regular (shared)</button><button class="${o.hire === 'special' ? 'on' : ''}" data-mod="special">Special trip</button></div></div>
    <div><span class="label">Discount (RA 9994, RA 10754)</span><select class="field" data-mod-disc><option value="none">None</option>${['student', 'senior', 'pwd'].map(d => `<option value="${d}" ${o.disc === d ? 'selected' : ''}>${d === 'pwd' ? 'PWD' : d[0].toUpperCase() + d.slice(1)}</option>`).join('')}</select></div>
    ${o.disc !== 'none' ? `<div><span class="label">Discounted passengers</span><div class="stepper"><button data-mod="dp-">−</button><b>${o.dpax}</b><button data-mod="dp+">+</button></div></div>` : ''}
    <button class="btn primary" data-mod="done">Done</button></div></div></div>`;
};
Pp.fareModalAct = function (el) {
  const P = this, o = P.ride.opts, a = el.dataset.mod;
  if (a === 'pax-') o.pax = Math.max(1, o.pax - 1); if (a === 'pax+') o.pax = Math.min(4, o.pax + 1);
  if (a === 'dp-') o.dpax = Math.max(1, o.dpax - 1); if (a === 'dp+') o.dpax = Math.min(o.pax, o.dpax + 1);
  o.dpax = Math.min(o.dpax, o.pax);
  if (a === 'regular' || a === 'special') o.hire = a;
  if (a === 'done') { P.content.querySelector('.modalhost').innerHTML = ''; return P.drawRideSheet(); }
  P.fareModal();
};
Pp.book = function () {
  const P = this, R = P.ride, trip = { pickup: { ...R.pickup }, stops: R.stops.slice(), opts: { ...R.opts } };
  if (R.option === 'terminal') return P.act('ticket', trip).then(res => {
    if (res.error) return P.toast(res.error);
    R.ticket = res.ticket; R.step = 'done'; P.drawRideSheet();
  });
  if (!(P.account.contacts || []).length) P.toast('Tip: add an emergency contact in Account > Safety');
  return P.act('book', trip).then(res => {
    if (res.error) return P.toast(res.error);
    R.reqId = res.id; R.step = 'active'; R.refit = true; P._rideKey = null;
    P.drawRideSheet();
  });
};

/* =====================================================================
   START: passenger + driver side by side on a laptop; one phone on a phone
   ===================================================================== */
let phones = [];
function start() {
  // connected: one phone per device, signed in with the token this phone keeps
  const wide = !REMOTE && window.matchMedia('(min-width: 861px)').matches;
  Hub.listeners.clear();
  // fresh elements, so phones from before a reset stop receiving taps
  const fresh = id => { const old = document.getElementById(id), el = old.cloneNode(false); old.replaceWith(el); return el; };
  phones = [new Phone(fresh('phone-a'), wide ? 'u-ana' : REMOTE ? null : store.get('panaw-local-me'))];
  if (wide) phones.push(new Phone(fresh('phone-b'), 'u-bobong'));
}
if (REMOTE) {
  document.body.classList.add('connected');
  document.querySelector('.stage-bar').style.display = 'none';
  start();
  Remote.phone = phones[0];
  Remote.token = store.get('panaw-token');
  if (Remote.token) Remote.poll().then(() => { const P = phones[0]; if (P.account) { P.tab = null; P.render(); if (P.isDriver() && P.me().online) P.startGps(); } });
  setInterval(() => Remote.poll(), 1500);
} else {
  loadLocal();
  start();
  setInterval(() => H.tick(), 700);
  setInterval(saveLocal, 10000);
}
document.getElementById('reset-demo').onclick = () => { store.set(LOCAL_KEY, null); seedHub(); start(); };
</script>
